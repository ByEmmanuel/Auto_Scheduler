<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auto Scheduler</title>
    <meta name="description" content="Tareas de Google Classroom sincronizadas con Google Calendar" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica el tema antes del primer pintado para evitar el flash de color.
      try {
        var stored = localStorage.getItem('as-theme')
        var dark = stored ? stored === 'dark' : true
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
